server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: farm-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/lands/**, /api/plots/**, /api/site-visits/**
        - id: knowledge-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/crops/**, /api/varieties/**, /api/templates/**, /api/compatibility/**
        - id: rental-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/reservations/**, /api/rentals/**, /api/cancellations/**
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/payments/**, /api/v1/payments/**
        - id: cultivation-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/tasks/**, /api/diary/**, /api/services/**, /api/issues/**, /api/harvest/**
        - id: communication-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/conversations/**, /api/messages/**, /api/consultations/**, /api/notifications/**, /api/v1/conversations/**, /api/v1/notifications/**
        - id: monitoring-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/sensors/**, /api/weather/**, /api/alerts/**, /api/files/**
        - id: ai-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/ai/**
