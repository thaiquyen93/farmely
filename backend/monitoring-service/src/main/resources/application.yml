server:
  port: 8088

spring:
  application:
    name: monitoring-service
  datasource:
    url: jdbc:postgresql://localhost:5433/farmely
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

farmely:
  sensor:
    simulation:
      enabled: true
      # Chu kỳ sinh dữ liệu mới (ms) - 15000ms = 15 giây (rất thích hợp để demo realtime)
      interval-ms: 15000
      # Danh sách các PlotId cần sinh dữ liệu giả lập
      plots: "1,2,3,4"

