server:
  port: ${PORT:8088}

spring:
  application:
    name: monitoring-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:farmely}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

farmely:
  sensor:
    simulation:
      enabled: ${SENSOR_SIMULATION_ENABLED:true}
      # Chu kỳ sinh dữ liệu mới (ms) - 15000ms = 15 giây (rất thích hợp để demo realtime)
      interval-ms: ${SENSOR_SIMULATION_INTERVAL_MS:15000}
      # Danh sách các PlotId cần sinh dữ liệu giả lập
      plots: ${SENSOR_SIMULATION_PLOTS:1,2,3,4}
