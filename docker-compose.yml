services:
  postgres:
    image: postgres:16-alpine
    container_name: smartagrirent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: @Bin054206
      POSTGRES_DB: farmely
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmely"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - smartagrirent-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smartagrirent-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - smartagrirent-net

networks:
  smartagrirent-net:
    driver: bridge

volumes:
  postgres_data:
