        <path d="M 762 360 L 768 366 L 779 354" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      
    
          
        <text x="770" y="425" font-family="'Inter', 'Segoe UI', sans-serif" font-size="19" font-weight="800" fill="#2B2625" text-anchor="middle">
