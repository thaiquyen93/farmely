<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { text-rendering: geometricPrecision; }
    </style>
  </defs>

  <!-- Slide Background -->
  <rect width="1280" height="720" fill="#FFFFFF" />

  <!-- Slide Header -->
  <g id="slide-header">
    <text x="640" y="76" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="600" fill="#241E1C" text-anchor="middle" letter-spacing="0.5">
      Timeline: Plot Preparation for Rent
    </text>
    <text x="640" y="104" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8C7976" text-anchor="middle" letter-spacing="1.2">
      FLOW 1 — NÔNG TRẠI & THỬA ĐẤT TỪ KHỞI TẠO ĐẾN NIÊM YẾT SÀN MARKETPLACE
    </text>
  </g>

  <!-- Horizontal Timeline Ribbon Bar -->
  <rect x="50" y="338" width="1180" height="44" rx="22" fill="#EAD6D6" />

  <!-- 4 Timeline Nodes & Actions -->
  
        <g id="node-1">
          
        <line x1="190" y1="316" x2="190" y2="245" stroke="#3D3432" stroke-width="2" />
