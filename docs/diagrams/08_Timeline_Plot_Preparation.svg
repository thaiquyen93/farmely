        <line x1="1060" y1="354" x2="1060" y2="374" stroke="#FFFFFF" stroke-width="2" />
      
    
          
        <text x="950" y="495" font-family="'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#2B2625">
