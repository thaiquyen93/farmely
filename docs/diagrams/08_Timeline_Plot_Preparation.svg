  <!-- Slide Footer (Matching Presentation slide footer) -->
  <g id="slide-footer">
    <line x1="50" y1="675" x2="1230" y2="675" stroke="#E8E1DE" stroke-width="1" />
    <text x="60" y="695" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#8F8380">
      10/2026
    </text>
    <text x="640" y="695" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8F8380" text-anchor="middle" letter-spacing="1">
      FARMELY — SMART AGRIRENT PLATFORM
    </text>
    <text x="1220" y="695" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#8F8380" text-anchor="end">
